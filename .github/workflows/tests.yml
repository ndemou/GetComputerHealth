name: Windows Tests

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  tests:
    runs-on: windows-2022

    defaults:
      run:
        shell: powershell

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Show PowerShell version
        run: |
          $PSVersionTable.PSVersion

      - name: Run smoke tests for pull requests
        if: github.event_name == 'pull_request'
        run: |
          .\tests\run-all-tests.ps1 -Smoke

      - name: Run full tests for main pushes and manual runs
        if: github.event_name != 'pull_request'
        run: |
          .\tests\run-all-tests.ps1 -Detailed
